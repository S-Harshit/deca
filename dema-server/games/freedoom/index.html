<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Freedoom</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #missing { display: none; height: 100%; place-items: center; text-align: center; padding: 2rem; line-height: 1.6; }
  code { background: #222; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="missing">
  <div>
    <h2>Freedoom's game data isn't here yet</h2>
    <p>Run <code>dema-server/games/freedoom/get-wad.sh</code> once (it downloads the free, BSD-licensed Freedoom data), then reload.</p>
  </div>
</div>
<script>
/*
 * Freedoom (https://freedoom.github.io), BSD-licensed free game data, run on the PrBoom engine inside
 * EmulatorJS (GPL, loaded from its CDN). Nothing here is copyrighted by id Software or anyone else
 * who has not licensed it for free use. Controls are EmulatorJS's default keys for the PrBoom core (see game.json,
 * which the panel shows): arrows move/turn, A fires, Z opens/uses, S runs. Esc returns you to the chat.
 */
fetch("freedoom1.wad", { method: "HEAD" }).then((r) => {
  if (!r.ok) { document.getElementById("game").style.display = "none"; document.getElementById("missing").style.display = "grid"; return; }
  window.EJS_player = "#game";
  window.EJS_core = "prboom";
  window.EJS_gameName = "Freedoom";
  window.EJS_gameUrl = "freedoom1.wad";
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_volume = 0.5;
  window.EJS_color = "#c6f432";
  const s = document.createElement("script");
  s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
  document.body.appendChild(s);
});
</script>
</body>
</html>
