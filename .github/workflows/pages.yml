# Publishes the no-server build to GitHub Pages. Run it by hand (Actions tab) once Pages is enabled.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions" (a private repo needs a paid plan).
# To publish on every push instead, add:  push: { branches: [main] }  under "on:".
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-static.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static
      - id: deployment
        uses: actions/deploy-pages@v4
